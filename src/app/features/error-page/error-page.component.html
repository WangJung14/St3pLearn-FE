<div class="error-page-container">
  <div class="error-card">
    <div class="error-illustration">
      <div class="code-badge">{{ currentError.code }}</div>
      <svg class="illustration-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 11-18 0 9 9 0 0118 0zm-9 3.75h.008v.008H12v-.008z" />
      </svg>
    </div>

    <h1 class="error-title">{{ currentError.title }}</h1>
    <p class="error-message">{{ currentError.message }}</p>

    <div class="error-actions">
      <a routerLink="/">
        <app-button variant="primary" size="lg">Quay Lại Trang Chủ</app-button>
      </a>
    </div>
  </div>
</div>
