<button
  [type]="type()"
  [disabled]="disabled() || loading()"
  [attr.aria-label]="ariaLabel() || null"
  [attr.aria-busy]="loading()"
  [class.btn-primary]="variant() === 'primary'"
  [class.btn-secondary]="variant() === 'secondary'"
  [class.btn-ghost]="variant() === 'ghost'"
  [class.btn-danger]="variant() === 'danger'"
  [class.btn-outline]="variant() === 'outline'"
  [class.btn-sm]="size() === 'sm'"
  [class.btn-md]="size() === 'md'"
  [class.btn-lg]="size() === 'lg'"
  [class.btn-full]="fullWidth()"
  [class.is-loading]="loading()"
  class="btn"
  (click)="onClick($event)"
>
  @if (loading()) {
    <svg class="btn-spinner" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <circle class="spinner-track" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3"></circle>
      <path class="spinner-head" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
    </svg>
  }
  <span class="btn-content" [class.btn-content-hidden]="loading()">
    <ng-content></ng-content>
  </span>
</button>
