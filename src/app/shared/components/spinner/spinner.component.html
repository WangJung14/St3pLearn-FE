<div
  class="spinner-container"
  [class.spinner-sm]="size() === 'sm'"
  [class.spinner-md]="size() === 'md'"
  [class.spinner-lg]="size() === 'lg'"
  [class.spinner-primary]="variant() === 'primary'"
  [class.spinner-white]="variant() === 'white'"
  [class.spinner-muted]="variant() === 'muted'"
  role="status"
  [attr.aria-label]="ariaLabel()"
>
  <svg class="spinner-svg" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
    <circle class="spinner-track" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3"></circle>
    <path class="spinner-head" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
  </svg>
  <span class="sr-only">{{ ariaLabel() }}</span>
</div>
